<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognition tree</title>
<style>
  :root {
    --lichen: #dfe3d6;
    --lichen-deep: #cfd5c4;
    --peat: #24302b;
    --peat-soft: #56635b;
    --leaf: #3b7a50;
    --heartwood: #6b4f3a;
    --pollen: #d39d12;
    --fog: #9aa597;
    --serif: "P052", "URW Palladio L", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 42% 50%, var(--lichen) 0 38%, var(--lichen-deep) 100%);
    color: var(--peat);
    font: 15px/1.5 var(--sans);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "head panel" "tree panel" "foot panel";
    overflow: hidden;
  }
  header { grid-area: head; padding: 22px 28px 0; }
  h1 {
    font: 400 34px/1.1 var(--serif);
    letter-spacing: 0.01em;
    margin: 0 0 4px;
  }
  .summary { margin: 0; color: var(--peat-soft); max-width: 60ch; }
  #tree { grid-area: tree; width: 100%; height: 100%; min-height: 0; cursor: grab; touch-action: none; }
  #tree.dragging { cursor: grabbing; }
  footer { grid-area: foot; padding: 0 28px 18px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .mode { border: 0; padding: 0; margin: 0; display: flex; gap: 4px; align-items: center; }
  .mode legend { float: left; margin-right: 8px; color: var(--peat-soft); }
  .mode label {
    padding: 4px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--fog); color: var(--peat-soft);
  }
  .mode input { position: absolute; opacity: 0; pointer-events: none; }
  .mode input:checked + span { color: var(--peat); }
  .mode label:has(input:checked) { background: var(--peat); border-color: var(--peat); }
  .mode label:has(input:checked) span { color: var(--lichen); }
  .mode label:has(input:focus-visible) { outline: 2px solid var(--pollen); outline-offset: 2px; }
  .legend { display: flex; gap: 14px; color: var(--peat-soft); font-size: 13px; flex-wrap: wrap; }
  .legend svg { vertical-align: -3px; margin-right: 4px; }

  aside {
    grid-area: panel;
    background: var(--peat);
    color: var(--lichen);
    padding: 28px 26px;
    overflow-y: auto;
  }
  aside h2 { font: 400 26px/1.15 var(--serif); margin: 0 0 6px; }
  aside .where { color: var(--fog); margin: 0 0 18px; }
  aside .status { display: inline-block; margin: 0 0 18px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
  aside .status.done { color: #8fd0a2; }
  aside .status.archived { color: #d2b294; }
  aside .status.current { color: #f0c14b; }
  aside .status.open, aside .status.unknown, aside .status.locked { color: var(--fog); }
  aside a { color: #f0c14b; }
  aside ul { list-style: none; padding: 0; margin: 0 0 18px; }
  aside li { padding: 6px 0; border-top: 1px solid rgba(223, 227, 214, 0.14); }
  aside li .req-status { float: right; color: var(--fog); }
  aside li.met .req-status { color: #8fd0a2; }
  aside .hint { color: var(--fog); }
  aside p { max-width: 42ch; }

  .stem { fill: none; stroke: var(--peat); stroke-width: 1.6; stroke-linecap: round; }
  .stem.missing { stroke: var(--fog); stroke-dasharray: 3 5; }
  .trunk { stroke-width: 3.2; }
  .stem.book { stroke: var(--heartwood); }
  .branch-label.book { font-style: italic; }
  .node { cursor: pointer; }
  .node circle.body { fill: var(--lichen); stroke: var(--peat); stroke-width: 1.4; }
  .node.done circle.body { fill: var(--leaf); stroke: var(--leaf); }
  .node.archived circle.body { fill: var(--heartwood); stroke: var(--heartwood); }
  .node.current circle.ring { fill: none; stroke: var(--pollen); stroke-width: 3; }
  .node.child circle.body { stroke-width: 1.1; }
  .node:focus { outline: none; }
  .node:focus-visible circle.body, .node.selected circle.body { stroke: var(--pollen); stroke-width: 3; }
  .tag { font: 600 11px var(--sans); fill: var(--peat); paint-order: stroke; stroke: var(--lichen); stroke-width: 3px; pointer-events: none; }
  .branch-label { font: 400 17px var(--serif); fill: var(--peat); cursor: pointer; }
  .branch-count { font: 12px var(--sans); fill: var(--peat-soft); pointer-events: none; }
  .root { fill: none; stroke-width: 1.2; }
  .root.met { stroke: var(--leaf); }
  .root.open { stroke: var(--fog); stroke-dasharray: 4 5; }
  .root.unknown { stroke: var(--fog); stroke-dasharray: 1 6; stroke-linecap: round; opacity: 0.8; }
  .spore circle.shell { fill: var(--lichen-deep); stroke: var(--fog); stroke-width: 1.5; stroke-dasharray: 2 4; }
  .spore.open circle.shell { fill: var(--pollen); stroke: var(--peat); stroke-dasharray: none; }
  .spore text { font: 400 16px var(--serif); fill: var(--peat-soft); }
  .spore.open text { fill: var(--peat); }
  .spore .spore-count { font: 12px var(--sans); }
  .core { fill: var(--peat); }
  .core-text { font: 400 13px var(--serif); fill: var(--lichen); pointer-events: none; }

  @media (prefers-reduced-motion: no-preference) {
    .grow { animation: grow 1.1s cubic-bezier(.3,.6,.2,1) both; }
    @keyframes grow { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
    .bloom { animation: bloom 1.6s ease-out both; transform-box: fill-box; transform-origin: center; }
    @keyframes bloom {
      0% { transform: scale(0.2); opacity: 0; }
      60% { transform: scale(1.35); opacity: 1; }
      100% { transform: scale(1); }
    }
  }

  @media (max-width: 760px) {
    body {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto 60vh auto auto;
      grid-template-areas: "head" "tree" "foot" "panel";
      overflow: auto;
    }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<header>
  <h1>Cognition tree</h1>
  <p class="summary" id="summary"></p>
</header>

<svg id="tree" role="group" aria-label="Learning branches drawn as a tree"></svg>

<footer>
  <fieldset class="mode">
    <legend>Locked branches</legend>
    <label><input type="radio" name="mode" value="silhouettes"><span>Show as silhouettes</span></label>
    <label><input type="radio" name="mode" value="surprise"><span>Keep as a surprise</span></label>
  </fieldset>
  <div class="legend" aria-hidden="true">
    <span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="#3b7a50"/></svg>done</span>
    <span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="#6b4f3a"/></svg>archived</span>
    <span><svg width="16" height="16"><circle cx="8" cy="8" r="4.5" fill="#dfe3d6" stroke="#24302b"/><circle cx="8" cy="8" r="7" fill="none" stroke="#d39d12" stroke-width="2"/></svg>current</span>
    <span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="#dfe3d6" stroke="#24302b"/></svg>not yet</span>
  </div>
</footer>

<aside id="panel" aria-live="polite"></aside>

<script id="tree-data" type="application/json">__TREE_DATA__</script>
<script>
(() => {
  "use strict";
  const data = JSON.parse(document.getElementById("tree-data").textContent);
  const svg = document.getElementById("tree");
  const panel = document.getElementById("panel");
  const NS = "http://www.w3.org/2000/svg";
  const MODE_KEY = "cognition-tree:mode";
  const SEEN_KEY = "cognition-tree:opened";

  const R_CORE = 34, R_TRUNK = 120, R_MAX = 440, R_SPORE = R_MAX + 92;

  function el(name, attrs = {}, parent) {
    const node = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  }
  function polar(r, a) { return [r * Math.cos(a), r * Math.sin(a)]; }
  function smoothPath(points) {
    let d = `M${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
    for (let i = 1; i < points.length - 1; i++) {
      const [x, y] = points[i];
      const [nx, ny] = points[i + 1];
      d += ` Q${x.toFixed(1)},${y.toFixed(1)} ${((x + nx) / 2).toFixed(1)},${((y + ny) / 2).toFixed(1)}`;
    }
    const last = points[points.length - 1];
    if (points.length > 1) d += ` L${last[0].toFixed(1)},${last[1].toFixed(1)}`;
    return d;
  }
  function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }
  function readStore(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
  }
  function writeStore(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage may be off for file pages */ }
  }

  function stepStatus(step) {
    if (step.done && step.archived) return "archived";
    if (step.done) return "done";
    if (step.current) return "current";
    return "open";
  }
  const STATUS_WORDS = {
    done: "Done", archived: "Done, archived", current: "You are here", open: "Not yet",
    met: "Met", unknown: "Not on the map yet", locked: "Locked",
  };

  // Positions of every step, so that locked branches can grow roots from them.
  const stepIndex = new Map();   // "repo|ID" -> {x, y, step}
  const groupLast = new Map();   // "repo|GROUP" -> {x, y}
  const branchTip = new Map();   // repo -> {x, y, angle}

  function layout() {
    const branches = data.branches;
    const n = Math.max(branches.length, 1);
    const sector = (2 * Math.PI) / n;
    const longest = Math.max(1, ...branches.flatMap(b => b.lines.map(l => l.steps.length)));
    const gap = Math.min(30, (R_MAX - R_TRUNK - 24) / longest);
    return branches.map((branch, i) => {
      const angle = -Math.PI / 2 + i * sector;
      const lines = branch.lines.length ? branch.lines : [];
      const spread = sector * 0.5;
      const placed = lines.map((line, j) => {
        const offset = lines.length > 1 ? (j / (lines.length - 1) - 0.5) * spread : 0;
        const base = angle + offset;
        const curl = (j % 2 === 0 ? 1 : -1) * 0.06;
        const steps = line.steps.map((step, k) => {
          const t = line.steps.length > 1 ? k / (line.steps.length - 1) : 0;
          const a = base + curl * Math.sin(t * Math.PI);
          const r = R_TRUNK + 24 + k * gap;
          const [x, y] = polar(r, a);
          const children = (step.children || []).map((child, c) => {
            const side = c % 2 === 0 ? 1 : -1;
            const ca = a + side * (0.035 + 0.02 * Math.floor(c / 2));
            const [cx, cy] = polar(r + 10 + 6 * Math.floor(c / 2), ca);
            return { step: child, x: cx, y: cy, parent: [x, y] };
          });
          return { step, x, y, angle: a, children };
        });
        return { line, steps };
      });
      return { branch, angle, lines: placed };
    });
  }

  function drawBranch(group, placed, animate) {
    const { branch, angle, lines } = placed;
    const trunkEnd = polar(R_TRUNK, angle);
    const book = branch.book ? " book" : "";
    const trunk = el("path", { d: smoothPath([polar(R_CORE, angle), trunkEnd]), class: "stem trunk" + book + (branch.found ? "" : " missing") }, group);
    grow(trunk, animate, 0);
    let tipR = R_TRUNK, tip = trunkEnd, tagged = false;
    for (const { line, steps } of lines) {
      if (!steps.length) continue;
      const pts = [trunkEnd, ...steps.map(s => [s.x, s.y])];
      grow(el("path", { d: smoothPath(pts), class: "stem" + book }, group), animate, 0.25);
      for (const s of steps) for (const c of s.children) {
        el("path", { d: `M${s.x.toFixed(1)},${s.y.toFixed(1)} L${c.x.toFixed(1)},${c.y.toFixed(1)}`, class: "stem", "stroke-width": 1 }, group);
      }
      for (const s of steps) {
        s.tagged = s.step.current && !tagged;
        if (s.tagged) tagged = true;
        drawNode(group, s, branch, line, false);
        for (const c of s.children) drawNode(group, c, branch, line, true);
        if (s.step.group) groupLast.set(`${branch.repo}|${s.step.group}`, { x: s.x, y: s.y });
      }
      const last = steps[steps.length - 1];
      const r = Math.hypot(last.x, last.y);
      if (r > tipR) { tipR = r; tip = [last.x, last.y]; }
    }
    branchTip.set(branch.repo, { x: tip[0], y: tip[1], angle });

    const [lx, ly] = polar(tipR + 26, angle);
    const anchor = Math.abs(Math.cos(angle)) < 0.25 ? "middle" : (Math.cos(angle) > 0 ? "start" : "end");
    const dy = Math.sin(angle) < -0.6 ? -6 : (Math.sin(angle) > 0.6 ? 14 : 4);
    const label = el("text", { x: lx, y: ly + dy, "text-anchor": anchor, class: "branch-label" + book, tabindex: 0, role: "button" }, group);
    label.textContent = branch.book && branch.book.emblem ? `${branch.book.emblem} ${branch.title}` : branch.title;
    el("text", { x: lx, y: ly + dy + 16, "text-anchor": anchor, class: "branch-count" }, group).textContent =
      branch.found ? `${branch.done} of ${branch.total}` : "not found";
    bindSelect(label, () => showBranch(branch));
  }

  function grow(path, animate, delay) {
    if (!animate) return;
    const len = path.getTotalLength();
    path.style.setProperty("--len", len);
    path.style.strokeDasharray = path.classList.contains("missing") ? "" : len;
    path.style.animationDelay = `${delay}s`;
    path.classList.add("grow");
    path.addEventListener("animationend", () => { path.style.strokeDasharray = ""; path.classList.remove("grow"); }, { once: true });
  }

  function drawNode(group, placed, branch, line, isChild) {
    const { step, x, y } = placed;
    const status = stepStatus(step);
    const g = el("g", {
      class: `node ${status}${isChild ? " child" : ""}`,
      transform: `translate(${x.toFixed(1)},${y.toFixed(1)})`,
      tabindex: 0, role: "button",
      "aria-label": `${step.id} ${step.title}, ${STATUS_WORDS[status]}`,
    }, group);
    if (status === "current") el("circle", { r: 9.5, class: "ring" }, g);
    el("circle", { r: isChild ? 3.6 : 5.6, class: "body" }, g);
    if (placed.tagged && !/:/.test(step.id)) {
      // Beside the stem, not along it, so the next nodes never cover the tag.
      let nx = -Math.sin(placed.angle), ny = Math.cos(placed.angle);
      if (Math.abs(Math.cos(placed.angle)) > 0.5 ? ny > 0 : nx < 0) { nx = -nx; ny = -ny; }
      const anchor = Math.abs(nx) < 0.5 ? "middle" : (nx > 0 ? "start" : "end");
      const t = el("text", { x: (x + nx * 15).toFixed(1), y: (y + ny * 15 + 4).toFixed(1), "text-anchor": anchor, class: "tag" }, tagLayer);
      t.textContent = step.id;
    }
    stepIndex.set(`${branch.repo}|${step.id}`, { x, y, step });
    bindSelect(g, () => showStep(branch, line, step, g));
  }

  let selected = null;
  let tagLayer = null;  // drawn last, above every node
  function bindSelect(node, fn) {
    node.addEventListener("click", e => { e.stopPropagation(); fn(); });
    node.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); }
    });
  }
  function mark(node) {
    if (selected) selected.classList.remove("selected");
    selected = node || null;
    if (selected) selected.classList.add("selected");
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function safeUrl(u) { return /^https?:\/\//.test(u || "") ? u : null; }

  function showStep(branch, line, step, node) {
    mark(node);
    const status = stepStatus(step);
    const where = [branch.title, line.title].filter(Boolean).join(", ");
    const id = /:/.test(step.id) ? "" : `${esc(step.id)} `;
    panel.innerHTML = `
      <h2>${id}${esc(step.title)}</h2>
      <p class="where">${esc(where)}${step.group ? `, block ${esc(step.group)}` : ""}</p>
      <span class="status ${status}">${STATUS_WORDS[status]}</span>
      ${branch.url && safeUrl(branch.url) ? `<p><a href="${esc(branch.url)}" target="_blank" rel="noopener">Open ${esc(branch.repo)}</a></p>` : ""}`;
  }

  function showBranch(branch) {
    mark(null);
    const lines = branch.lines.map(l => {
      const all = l.steps.flatMap(s => [s, ...(s.children || [])]);
      const done = all.filter(s => s.done).length;
      const cur = l.steps.find(s => s.current);
      return `<li>${esc(l.title || "Steps")}<span class="req-status">${done} of ${all.length}</span>
        ${cur ? `<br><span class="hint">Now: ${esc(cur.id.includes(":") ? cur.title : cur.id + " " + cur.title)}</span>` : ""}</li>`;
    }).join("");
    panel.innerHTML = `
      <h2>${esc(branch.book && branch.book.emblem ? `${branch.book.emblem} ${branch.title}` : branch.title)}</h2>
      ${branch.book ? `<p class="where">Book: ${esc(branch.book.title)}</p>` : ""}
      <p class="where">${branch.found ? `${branch.done} of ${branch.total} steps done` : "The repository or its progress file was not found."}</p>
      ${lines ? `<ul>${lines}</ul>` : ""}
      ${safeUrl(branch.url) ? `<p><a href="${esc(branch.url)}" target="_blank" rel="noopener">Open ${esc(branch.repo)}</a></p>` : ""}`;
  }

  function showLocked(lock, node) {
    mark(node);
    const named = lock.open || !lock.hidden;
    const reqs = lock.requires.map(r => `
      <li class="${r.status}">${named ? esc(r.label || r.step) : "A step somewhere"}
        <span class="req-status">${STATUS_WORDS[r.status]}</span>
        ${named ? `<br><span class="hint">${esc(repoTitle(r.repo))}, ${esc(r.step)}</span>` : ""}</li>`).join("");
    const src = lock.source && safeUrl(lock.source.url);
    panel.innerHTML = `
      <h2>${named ? esc(lock.title) : "Something is waiting here"}</h2>
      <p class="where">${lock.open ? "Open. Every prerequisite is met." : `${lock.met} of ${lock.total} prerequisites met`}</p>
      <span class="status ${lock.open ? "current" : "locked"}">${lock.open ? "Open" : "Locked"}</span>
      ${reqs ? `<ul>${reqs}</ul>` : ""}
      ${named && lock.note ? `<p>${esc(lock.note)}</p>` : ""}
      ${named && src ? `<p><a href="${esc(src)}" target="_blank" rel="noopener">${esc(lock.source.title || src)}</a></p>` : ""}`;
  }

  function repoTitle(repo) {
    const b = data.branches.find(b => b.repo === repo);
    return b ? b.title : repo;
  }

  function anchorFor(req) {
    return stepIndex.get(`${req.repo}|${req.step}`)
      || groupLast.get(`${req.repo}|${req.step}`)
      || branchTip.get(req.repo)
      || null;
  }

  function drawLocked(group, mode, animate) {
    const seen = new Set(readStore(SEEN_KEY, []));
    const visible = data.locked.filter(l => l.open || mode === "silhouettes");
    visible.forEach((lock, i) => {
      const anchors = lock.requires.map(r => ({ r, p: anchorFor(r) })).filter(a => a.p);
      let sx = 0, sy = 0;
      for (const { p } of anchors) { const a = Math.atan2(p.y, p.x); sx += Math.cos(a); sy += Math.sin(a); }
      let angle = Math.hypot(sx, sy) > 0.3 ? Math.atan2(sy, sx) : (Math.PI / 4) + i * 0.7;
      angle += i * 0.18;
      const [x, y] = polar(R_SPORE, angle);
      for (const { r, p } of anchors) {
        const mid = polar(R_MAX * 0.92, (Math.atan2(p.y, p.x) + angle) / 2 + (Math.abs(Math.atan2(p.y, p.x) - angle) > Math.PI ? Math.PI : 0));
        el("path", { d: `M${p.x.toFixed(1)},${p.y.toFixed(1)} Q${mid[0].toFixed(1)},${mid[1].toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}`, class: `root ${r.status}` }, group);
      }
      const named = lock.open || !lock.hidden;
      const g = el("g", {
        class: `spore${lock.open ? " open" : ""}`, transform: `translate(${x.toFixed(1)},${y.toFixed(1)})`,
        tabindex: 0, role: "button",
        "aria-label": `${named ? lock.title : "Hidden branch"}, ${lock.open ? "open" : `${lock.met} of ${lock.total} prerequisites met`}`,
      }, group);
      const shell = el("circle", { r: lock.open ? 13 : 11, class: "shell" }, g);
      const anchor = Math.cos(angle) >= 0 ? "start" : "end";
      const tx = Math.cos(angle) >= 0 ? 20 : -20;
      el("text", { x: tx, y: 0, "text-anchor": anchor }, g).textContent = named ? lock.title : "???";
      el("text", { x: tx, y: 17, "text-anchor": anchor, class: "spore-count" }, g).textContent =
        lock.open ? "open" : `${lock.met} of ${lock.total}`;
      if (lock.open && !seen.has(lock.id)) {
        if (animate) shell.classList.add("bloom");
        seen.add(lock.id);
      }
      bindSelect(g, () => showLocked(lock, g));
    });
    writeStore(SEEN_KEY, [...seen]);
    return visible.length;
  }

  function render(mode, animate) {
    svg.textContent = "";
    stepIndex.clear(); groupLast.clear(); branchTip.clear();
    const world = el("g", { id: "world" }, svg);
    const roots = el("g", {}, world);
    const stems = el("g", {}, world);
    const tags = el("g", {});
    tagLayer = tags;
    for (const placed of layout()) drawBranch(stems, placed, animate);
    world.appendChild(tags);
    el("circle", { r: R_CORE, class: "core" }, world);
    const done = data.branches.reduce((s, b) => s + b.done, 0);
    const total = data.branches.reduce((s, b) => s + b.total, 0);
    el("text", { y: -2, "text-anchor": "middle", class: "core-text" }, world).textContent = `${done}`;
    el("text", { y: 13, "text-anchor": "middle", class: "core-text", "font-size": 10 }, world).textContent = `of ${total}`;
    drawLocked(roots, mode, animate);
    fit();
    applyView();
    summarize(mode, done, total);
  }

  function summarize(mode, done, total) {
    const sleeping = data.locked.filter(l => !l.open).length;
    const opened = data.locked.length - sleeping;
    let text = `${done} of ${plural(total, "step", "steps")} grown across ${plural(data.branches.length, "branch", "branches")}.`;
    if (opened) text += ` ${plural(opened, "locked branch has", "locked branches have")} opened.`;
    if (mode === "silhouettes" && sleeping) {
      text += opened ? ` ${plural(sleeping, "more is", "more are")} still locked.`
                     : ` ${plural(sleeping, "locked branch is", "locked branches are")} waiting.`;
    }
    document.getElementById("summary").textContent = text;
  }

  // Pan and zoom.
  const view = { x: 0, y: 0, k: 1 };
  let box = { x: -600, y: -600, w: 1200, h: 1200 };
  function fit() {
    const b = document.getElementById("world").getBBox();
    const pad = 24;
    box = { x: b.x - pad, y: b.y - pad, w: b.width + 2 * pad, h: b.height + 2 * pad };
  }
  function applyView() {
    const w = box.w / view.k, h = box.h / view.k;
    const cx = box.x + box.w / 2 - view.x, cy = box.y + box.h / 2 - view.y;
    svg.setAttribute("viewBox", `${(cx - w / 2).toFixed(1)} ${(cy - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    view.k = Math.min(6, Math.max(0.6, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    applyView();
  }, { passive: false });
  let drag = null;
  svg.addEventListener("pointerdown", e => {
    if (e.target.closest(".node, .spore, .branch-label")) return;
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    svg.setPointerCapture(e.pointerId);
    svg.classList.add("dragging");
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    const scale = Math.max(box.w / svg.clientWidth, box.h / svg.clientHeight) / view.k;
    view.x = drag.vx + (e.clientX - drag.x) * scale;
    view.y = drag.vy + (e.clientY - drag.y) * scale;
    applyView();
  });
  svg.addEventListener("pointerup", () => { drag = null; svg.classList.remove("dragging"); });

  function intro() {
    mark(null);
    const current = data.branches.filter(b => b.found).map(b => ({ b, steps: b.lines.flatMap(l => l.steps.filter(s => s.current)) }));
    const name = s => s.id.includes(":") ? s.title : `${s.id} ${s.title}`;
    panel.innerHTML = `
      <h2>Where you are</h2>
      <p class="where">Pick any node, branch name or locked seed to read it.</p>
      <ul>${current.map(({ b, steps }) => `<li>${esc(b.title)}<span class="req-status">${b.done} of ${b.total}</span>${steps.map(s => `<br><span class="hint">${esc(name(s))}</span>`).join("")}</li>`).join("")}</ul>
      <p class="hint">Built ${esc((data.generated_at || "").slice(0, 16).replace("T", " "))} from the progress files.</p>`;
  }
  svg.addEventListener("click", e => { if (!e.target.closest(".node, .spore, .branch-label")) intro(); });

  const params = new URLSearchParams(location.search);
  let mode = params.get("mode") || readStore(MODE_KEY, "silhouettes");
  if (mode !== "surprise") mode = "silhouettes";
  for (const input of document.querySelectorAll('input[name="mode"]')) {
    input.checked = input.value === mode;
    input.addEventListener("change", () => {
      mode = input.value;
      writeStore(MODE_KEY, mode);
      render(mode, false);
    });
  }
  render(mode, true);
  intro();
})();
</script>
</body>
</html>
